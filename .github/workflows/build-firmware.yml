name: Build ESP32 Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'coba-OTA-GITHUB.ino'
      - '.github/workflows/build-firmware.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Install Arduino CLI
      # ==========================================

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2


      # ==========================================
      # Configure Arduino CLI
      # ==========================================

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json


      # ==========================================
      # Install ESP32 Core 3.2.0
      # ==========================================

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0


      # ==========================================
      # Extract firmware version
      # ==========================================

      - name: Get firmware version
        id: version
        run: |

          VERSION=$(grep '#define FIRMWARE_VERSION' coba-OTA-GITHUB.ino | \
            sed -E 's/.*"([^"]+)".*/\1/')

          echo "Firmware version: $VERSION"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT


      # ==========================================
      # Compile ESP32
      # ==========================================

      - name: Compile firmware
        run: |

          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir build \
            coba-OTA-GITHUB.ino


      # ==========================================
      # Prepare firmware filename
      # ==========================================

      - name: Prepare firmware
        run: |

          mkdir -p firmare

          cp build/coba-OTA-GITHUB.ino.bin \
             firmare/coba-OTA-GITHUB.ino.bin


      # ==========================================
      # Update version.txt
      # ==========================================

      - name: Update version.txt
        run: |

          echo "${{ steps.version.outputs.VERSION }}" > version.txt


      # ==========================================
      # Commit firmware + version
      # ==========================================

      - name: Commit generated firmware
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add firmare/coba-OTA-GITHUB.ino.bin
          git add version.txt

          git diff --cached --quiet || \
            git commit -m "Build firmware v${{ steps.version.outputs.VERSION }}"

          git push
